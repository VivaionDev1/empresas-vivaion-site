name: Vivaion Empresas CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/portal-empresas-foundation]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: vivaion_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vivaion_empresas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vivaion_test -d vivaion_empresas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      APP_ORIGIN: http://localhost:4321
      DATABASE_URL: postgresql://vivaion_test:ci-only-password@127.0.0.1:5432/vivaion_empresas_test
      CORPORATE_PRICING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run check
      - name: Unit tests
        run: npm run test
      - name: Apply migrations in disposable database
        run: npm run db:migrate
      - name: Integration tests (auth, origin, tenant isolation, disabled gates)
        run: npm run test:integration
      - name: Production builds
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser and responsive smoke tests
        run: npm run test:e2e
