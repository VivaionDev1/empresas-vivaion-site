name: One-time dependency lockfile generator (feature branch only)
on:
  pull_request:
    branches: [feat/portal-empresas-foundation]
permissions:
  contents: write
jobs:
  lockfile:
    if: github.event.pull_request.head.ref == 'feat/empresas-hardening-02' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/empresas-hardening-02
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate reproducible lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to PR branch only
        run: |
          test -f package-lock.json
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(deps): lock workspace dependencies"
            git push origin HEAD:refs/heads/feat/empresas-hardening-02
          fi
